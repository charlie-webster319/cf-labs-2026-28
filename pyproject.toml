[project]
name = "cflabs"
version = "0.1.0"
description = "EC3318/MN3101 corporate finance teaching labs"
readme = "README.md"
requires-python = "==3.12.14"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "openpyxl==3.1.2",
    "plotnine==0.14.5",
    "mizani==0.13.1",
    "adjusttext==1.3.0",
    "PyPortfolioOpt==1.5.6",
    "cvxpy==1.6.4",
    "ipykernel==6.29.5",
]

[dependency-groups]
dev = ["nbclient==0.10.2", "nbformat==5.10.4"]
notebook-mcp = [
    # The 0.9.0 notebook providers use the pre-1.0 KernelClient API.
    "fastmcp>=2.12,<3",
    "jupyter-kernel-client<1",
    "the-notebook-mcp==0.9.0",
]

[tool.uv]
default-groups = []
package = false
# plotnine 0.14 uses Matplotlib APIs removed in newer releases. Keep the
# plotting/statistics stack used by the teaching examples, without exposing
# indirect dependencies as extra student requirements.
constraint-dependencies = [
    "matplotlib==3.8.4",
    "scipy==1.15.2",
    "statsmodels==0.14.4",
]
